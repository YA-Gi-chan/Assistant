name: Fetch banner materials

on:
  workflow_dispatch:
  push:
    branches:
      - claude/video-editing-subtitles-ads-ngbblh
    paths:
      - .github/workflows/fetch-banner.yml
      - assets/.fetch-trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/video-editing-subtitles-ads-ngbblh

      - name: Deep-crawl vernis.co.jp top page for the main key visual
        run: |
          python3 - <<'EOF'
          import re, os, hashlib, urllib.request, urllib.parse

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept-Language": "ja,en;q=0.8"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              return urllib.request.urlopen(req, timeout=20).read()

          pages = [
              "https://vernis.co.jp/",
              "https://vernis.co.jp/index.php",
          ]
          os.makedirs("assets/kv_found", exist_ok=True)
          texts = []
          css_seen = set()
          for url in pages:
              try:
                  html = get(url).decode("utf-8", "ignore")
              except Exception as e:
                  print("PAGE FAIL", url, e); continue
              texts.append((url, html))
              for href in re.findall(r'href=["\']([^"\'>]+\.css[^"\'>]*)["\']', html):
                  cssu = urllib.parse.urljoin(url, href)
                  if cssu in css_seen: continue
                  css_seen.add(cssu)
                  try:
                      texts.append((cssu, get(cssu).decode("utf-8", "ignore")))
                  except Exception as e:
                      print("CSS FAIL", cssu, e)

          imgs = set()
          for base, text in texts:
              for m in re.findall(r'[\w\-./:%]+\.(?:jpg|jpeg|png|gif|webp)', text, re.I):
                  imgs.add(urllib.parse.urljoin(base, m))

          manifest = []
          for img in sorted(imgs):
              if not urllib.parse.urlparse(img).netloc.endswith("vernis.co.jp"):
                  continue
              try:
                  data = get(img)
              except Exception as e:
                  print("IMG FAIL", img, e); continue
              if len(data) < 30000:
                  continue
              name = hashlib.md5(img.encode()).hexdigest()[:10] + "_" + os.path.basename(urllib.parse.urlparse(img).path)
              with open(os.path.join("assets/kv_found", name), "wb") as f:
                  f.write(data)
              manifest.append(f"{name}\t{len(data)}\t{img}")
              print("SAVED", name, len(data), img)
          with open("assets/kv_found/manifest.txt", "w") as f:
              f.write("\n".join(manifest) + "\n")
          EOF

      - name: Commit results
        run: |
          git config user.name "banner-fetch-bot"
          git config user.email "actions@github.com"
          git pull --rebase origin claude/video-editing-subtitles-ads-ngbblh || true
          git add assets/kv_found || true
          git diff --cached --quiet || git commit -m "Add fetched key visual candidates"
          git push origin HEAD:claude/video-editing-subtitles-ads-ngbblh
